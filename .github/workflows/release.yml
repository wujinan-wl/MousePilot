# 推送 v* tag 時：建置單一 EXE 並發佈 GitHub Release（附加 MousePilot.exe）
# 發布流程：更新 VERSION/CHANGELOG → 本地建 tag vX.Y.Z → git push origin main --tags
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MousePilot.csproj

      - name: Test
        run: dotnet test tests/MousePilot.Tests --configuration Release

      - name: Publish single EXE
        run: dotnet publish MousePilot.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      # 獨立目錄啟動驗證（防 dotnet/runtime#61279 回歸）：
      # publish 目錄不得殘留 *_cor3.dll；只複製 MousePilot.exe 到全新目錄啟動，
      # 程序須存活且 log 出現「程式啟動」成功標記，否則 CI 失敗、不得發佈。
      - name: Standalone EXE smoke test
        shell: pwsh
        run: ./tools/publish-smoke-test.ps1 -PublishDir bin/Release/net8.0-windows/win-x64/publish -TimeoutSeconds 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/MousePilot.exe
          generate_release_notes: true
